<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />
  
  <!-- Outer Ring (Network/DNS) -->
  <circle cx="256" cy="236" r="160" fill="none" stroke="#334155" stroke-width="12" stroke-dasharray="20 15" />
  <circle cx="256" cy="236" r="120" fill="none" stroke="#475569" stroke-width="4" />

  <!-- Core Globe -->
  <circle cx="256" cy="236" r="80" fill="url(#globeGradient)" filter="url(#glow)" />
  
  <!-- Globe Meridians and Parallels -->
  <path d="M 256 156 A 40 80 0 0 0 256 316 A 40 80 0 0 0 256 156" fill="none" stroke="#bfdbfe" stroke-width="4" opacity="0.6" />
  <path d="M 176 236 Q 256 276 336 236" fill="none" stroke="#bfdbfe" stroke-width="4" opacity="0.6" />
  <path d="M 176 236 Q 256 196 336 236" fill="none" stroke="#bfdbfe" stroke-width="4" opacity="0.6" />

  <!-- Local Node (LocalHost) overlapping the globe -->
  <circle cx="256" cy="236" r="28" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="236" r="10" fill="#ffffff" />

  <!-- Connection lines (Host Mapping) -->
  <path d="M 256 236 L 140 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <circle cx="140" cy="120" r="14" fill="#10b981" />
  
  <path d="M 256 236 L 372 120" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <circle cx="372" cy="120" r="14" fill="#10b981" />
  
  <path d="M 256 236 L 256 76" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="76" r="14" fill="#10b981" />

  <!-- Author Badge Area -->
  <rect x="120" y="420" width="272" height="52" rx="26" fill="#1e293b" stroke="#334155" stroke-width="2" />
  
  <!-- App Name Text -->
  <text x="256" y="455" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#f8fafc" text-anchor="middle" letter-spacing="1">LocalHosts</text>
</svg>
