<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Globe Gradient -->
    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Node Gradient -->
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base (Rounded Rect for App Icon) -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGradient)" />
  
  <!-- Outer Ring (Network/DNS) -->
  <circle cx="512" cy="472" r="320" fill="none" stroke="#334155" stroke-width="24" stroke-dasharray="40 30" />
  <circle cx="512" cy="472" r="240" fill="none" stroke="#475569" stroke-width="8" />

  <!-- Core Globe -->
  <circle cx="512" cy="472" r="160" fill="url(#globeGradient)" filter="url(#glow)" />
  
  <!-- Globe Meridians and Parallels -->
  <path d="M 512 312 A 80 160 0 0 0 512 632 A 80 160 0 0 0 512 312" fill="none" stroke="#bfdbfe" stroke-width="8" opacity="0.6" />
  <path d="M 352 472 Q 512 552 672 472" fill="none" stroke="#bfdbfe" stroke-width="8" opacity="0.6" />
  <path d="M 352 472 Q 512 392 672 472" fill="none" stroke="#bfdbfe" stroke-width="8" opacity="0.6" />

  <!-- Local Node (LocalHost) overlapping the globe -->
  <circle cx="512" cy="472" r="56" fill="url(#nodeGradient)" stroke="#ffffff" stroke-width="12" />
  <circle cx="512" cy="472" r="20" fill="#ffffff" />

  <!-- Connection lines (Host Mapping) -->
  <path d="M 512 472 L 280 240" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  <circle cx="280" cy="240" r="28" fill="#10b981" />
  
  <path d="M 512 472 L 744 240" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  <circle cx="744" cy="240" r="28" fill="#10b981" />
  
  <path d="M 512 472 L 512 152" fill="none" stroke="#10b981" stroke-width="16" stroke-linecap="round" />
  <circle cx="512" cy="152" r="28" fill="#10b981" />

  <!-- Author Badge Area -->
  <rect x="240" y="840" width="544" height="104" rx="52" fill="#1e293b" stroke="#334155" stroke-width="4" />
  
  <!-- App Name Text -->
  <text x="512" y="910" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="56" fill="#f8fafc" text-anchor="middle" letter-spacing="2">LocalHosts</text>
</svg>